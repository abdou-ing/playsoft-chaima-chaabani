---
# ============================================================
# Task file : récupère tous les secrets depuis HashiCorp Vault
# Inclus via include_tasks depuis les playbooks
# Token Vault défini dans vars.yml → vault_token
# ============================================================

- name: Récupérer secrets JumpServer depuis Vault (kv-dev/chaima/jumpserver)
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_url }}"
    path: "chaima/jumpserver"
    engine_mount_point: "{{ vault_mount }}"
    auth_method: token
    token: "{{ vault_token }}"
  register: vault_jumpserver
  no_log: true

- name: Récupérer token Hetzner depuis Vault (kv-dev/chaima/hetzner)
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_url }}"
    path: "chaima/hetzner"
    engine_mount_point: "{{ vault_mount }}"
    auth_method: token
    token: "{{ vault_token }}"
  register: vault_hetzner
  no_log: true

- name: Récupérer IPs et clé SSH des serveurs depuis Vault (kv-dev/chaima/servers)
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_url }}"
    path: "chaima/servers"
    engine_mount_point: "{{ vault_mount }}"
    auth_method: token
    token: "{{ vault_token }}"
  register: vault_servers
  no_log: true

- name: Récupérer mots de passe utilisateurs depuis Vault (kv-dev/chaima/users)
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_url }}"
    path: "chaima/users"
    engine_mount_point: "{{ vault_mount }}"
    auth_method: token
    token: "{{ vault_token }}"
  register: vault_users
  no_log: true

- name: Définir toutes les variables depuis Vault
  set_fact:
    jumpserver_url: "{{ vault_jumpserver.secret.url }}"
    jumpserver_admin_password: "{{ vault_jumpserver.secret.admin_password }}"
    jumpserver_api_token: "{{ vault_jumpserver.secret.token }}"
    hetzner_token: "{{ vault_hetzner.secret.token }}"
    public_server: "{{ public_server | combine({
        'ip': vault_servers.secret.public_ip,
        'ssh_private_key_path': vault_servers.secret.ssh_key_path
      }) }}"
    private_server: "{{ private_server | combine({
        'ip': vault_servers.secret.private_ip,
        'ssh_private_key_path': vault_servers.secret.ssh_key_path
      }) }}"
    admin_user: "{{ admin_user | combine({'password': vault_users.secret.admin_password}) }}"
    devops_user: "{{ devops_user | combine({'password': vault_users.secret.devops_password}) }}"
  no_log: true
